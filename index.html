<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TO-DO List</title>
        <link rel="stylesheet" href="main.css" />
    </head>
    <body>
        <div class="todo-container">
            <h1>TO-DO List</h1>
            <p class="subtitle">Add and manage your tasks</p>
            <form id="todo-form">
                <input id="todo-input" type="text" placeholder="Add a new task" autocomplete="off" required />
                <button type="submit">Add</button>
            </form>
            <div class="filter-container" aria-label="Filter tasks">
                <button class="filter active" data-filter="all">All</button>
                <button class="filter" data-filter="active">Active</button>
                <button class="filter" data-filter="completed">Completed</button>
            </div>
            <ul id="todo-list">
                <li class="todo-item">
                    <input type="checkbox" aria-label="Mark as complete" />
                    <span class="task-text">Sample Task</span>
                    <button class="delete-btn">Delete</button>
                </li>   

            </ul>
                <p id="empty-message" style="display: none;">No tasks yet. Add a task to get started!</p>
                <p id="task-count" class="task-count">0 tasks left</p>
        </div>
       <script src="./index.js"></script>
    </body>
</html>
